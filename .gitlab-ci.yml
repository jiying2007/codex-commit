stages: [test, package]

default:
  image: node:22

cache:
  paths: [.npm/]

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

unit:linux:
  stage: test
  script:
    - test -f package-lock.json
    - npm ci --ignore-scripts
    - npm run check

integration:linux:
  stage: test
  script:
    - test -f package-lock.json
    - npm ci --ignore-scripts
    - apt-get update
    - apt-get install -y git xvfb libgtk-3-0 libnss3 libasound2
    - xvfb-run -a npm run test:integration

package:linux:
  stage: package
  needs: [unit:linux, integration:linux]
  script:
    - test -f package-lock.json
    - npm ci --ignore-scripts
    - npm run package
    - sha256sum *.vsix > SHA256SUMS
  artifacts:
    paths: ["*.vsix", SHA256SUMS]

integration:windows:
  stage: test
  tags: [windows]
  rules:
    - if: '$WINDOWS_EXTENSION_TESTS == "1"'
  script:
    - if (!(Test-Path package-lock.json)) { throw "package-lock.json is required" }
    - npm ci --ignore-scripts
    - npm run check
    - npm run test:integration
