name: Retire duplicate 1.2.1 maintenance branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'maintenance-1.2.1'
    runs-on: ubuntu-latest
    steps:
      - name: Delete duplicate maintenance branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/maintenance-1.2.1" >/dev/null 2>&1 || true
