name: Prepare Commit 4.2.4 Once
on:
  push:
    branches: [release/family-core-4.10.1]
    paths: [.github/workflows/_prepare-family-release-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/family-core-4.10.1
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: { node-version: '22.22.2' }
      - name: Prepare immutable Family release identity
        shell: bash
        run: |
          set -euo pipefail
          npm version 4.2.4 --no-git-tag-version --ignore-scripts
          node <<'NODE'
          const fs=require('fs');
          const p=require('./product-contract.json');
          p.productVersion='4.2.4';
          fs.writeFileSync('product-contract.json',JSON.stringify(p,null,2)+'\n');
          const f='CHANGELOG.md'; let s=fs.readFileSync(f,'utf8');
          const marker='# Changelog\n\n';
          if(!s.includes(marker)) throw new Error('Changelog heading missing');
          const entry='## 4.2.4 - 2026-08-31\n\n- Publish the already-validated Commit Safe main line on immutable Safe Core v4.10.1 (`76418b80533c644e3ab01045290cd3cdd355622c`) and Policy Schema v4.\n- No Commit generation authority, Safe Contract v2, Commit Receipt v4, Review Receipt v4, prompt contract, or model behavior change.\n\n';
          fs.writeFileSync(f,s.replace(marker,marker+entry));
          NODE
          git add package.json package-lock.json product-contract.json CHANGELOG.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(release): Commit 4.2.4 on Core 4.10.1'
          git push origin HEAD:release/family-core-4.10.1
