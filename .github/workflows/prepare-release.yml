name: Prepare 1.2.0 release

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'release-1.2.0' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-1.2.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          cat .release/part-* > /tmp/release.b64
          base64 -d /tmp/release.b64 > /tmp/release.tar.gz
          echo "c340eff2e99a12765ad99f940d0e3ee0803dc30cfbf975a8e4db36e6718cdf3b  /tmp/release.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar -xzf /tmp/release.tar.gz -C .
          rm -rf .release
          sed -i "s/getConfiguration('codexCommit'/getConfiguration('safeCodexCommit'/g" extension.js test/integration/suite/integration.test.js
          sed -i 's/Codex Commit 1\.1\.6 Extension Host integration tests passed\./Codex Commit Safe 1.2.0 Extension Host integration tests passed./g' test/integration/suite/integration.test.js
          sed -i 's/codex-commit-1\.1\.6\.vsix/codex-commit-safe-1.2.0.vsix/g' README.md
          if grep -R "codexCommit\|1\.1\.6" -n extension.js package.json test README.md SECURITY.md CHANGELOG.md; then
            echo "legacy identity/version reference remains" >&2
            exit 1
          fi

      - name: Generate real dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Unit and regression checks
        run: npm run check

      - name: Install Extension Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2

      - name: Extension Host integration tests
        run: xvfb-run -a npm run test:integration

      - name: Official VSIX package
        run: npm run package

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          test -f codex-commit-safe-1.2.0.vsix
          sha256sum codex-commit-safe-1.2.0.vsix > SHA256SUMS

      - name: Upload verified release outputs
        uses: actions/upload-artifact@v4
        with:
          name: codex-commit-safe-1.2.0
          path: |
            package-lock.json
            codex-commit-safe-1.2.0.vsix
            SHA256SUMS
          if-no-files-found: error

      - name: Persist verified non-workflow source via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          upload_file() {
            local file="$1"
            local encoded sha
            encoded=$(base64 -w0 "$file")
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=release-1.2.0" --jq '.sha' 2>/dev/null || true)
            if [ -n "$sha" ]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${file}" \
                -f message='refactor: rename extension identity' \
                -f branch='release-1.2.0' \
                -f content="$encoded" \
                -f sha="$sha" >/dev/null
            else
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${file}" \
                -f message='refactor: rename extension identity' \
                -f branch='release-1.2.0' \
                -f content="$encoded" >/dev/null
            fi
          }

          while IFS= read -r file; do
            upload_file "$file"
          done < <(find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -path './node_modules/*' \
            ! -name '*.vsix' \
            ! -name 'SHA256SUMS' \
            -printf '%P\n' | sort)

          for file in $(gh api "repos/${GITHUB_REPOSITORY}/contents/.release?ref=release-1.2.0" --jq '.[].path' 2>/dev/null || true); do
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=release-1.2.0" --jq '.sha')
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${file}" \
              -f message='chore: remove release scaffolding' \
              -f branch='release-1.2.0' \
              -f sha="$sha" >/dev/null
          done
