name: Prepare 1.2.0 release

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'release-1.2.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-1.2.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          cat .release/part-* > /tmp/release.b64
          base64 -d /tmp/release.b64 > /tmp/release.tar.gz
          echo "c340eff2e99a12765ad99f940d0e3ee0803dc30cfbf975a8e4db36e6718cdf3b  /tmp/release.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar -xzf /tmp/release.tar.gz -C .
          rm -rf .release

      - name: Generate real dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Unit and regression checks
        run: npm run check

      - name: Install Extension Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2

      - name: Extension Host integration tests
        run: xvfb-run -a npm run test:integration

      - name: Official VSIX package
        run: npm run package

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          test -f codex-commit-safe-1.2.0.vsix
          sha256sum codex-commit-safe-1.2.0.vsix > SHA256SUMS

      - name: Commit prepared release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          if ! git diff --cached --quiet; then
            git commit -m "refactor: rename extension identity"
            git push origin HEAD:release-1.2.0
          fi
