name: Temporary Commit Core 4.13.1 repin

on:
  push:
    branches: [fix/core-4.13.1-transcript]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Repin Core and prepare Commit 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          core_sha=479e4b33356457a90617aea7bbba5ee25b65b2c8
          curl -fsSL "https://raw.githubusercontent.com/jiying2007/codex-safe-core/${core_sha}/scripts/repin-consumer.js" -o /tmp/repin-consumer.js
          node /tmp/repin-consumer.js "$PWD" "$core_sha"
          node <<'NODE'
          const fs = require('node:fs');
          const version='4.5.1';
          const writeJson=(file,mutate)=>{if(!fs.existsSync(file))return;const value=JSON.parse(fs.readFileSync(file,'utf8'));mutate(value);fs.writeFileSync(file,JSON.stringify(value,null,2)+'\n');};
          writeJson('package.json',value=>{value.version=version;});
          writeJson('package-lock.json',value=>{value.version=version;if(value.packages?.[''])value.packages[''].version=version;});
          writeJson('product-contract.json',value=>{value.productVersion=version;});
          if(fs.existsSync('CHANGELOG.md')){let text=fs.readFileSync('CHANGELOG.md','utf8');if(!text.includes('## 4.5.1'))text=`## 4.5.1 - 2026-09-03\n\n- Repin to immutable Codex Safe Core 4.13.1 so Commit structured \`codex exec --json\` generation uses bounded retained stdout plus an independent fail-closed total transcript ceiling.\n- Prevent large staged-context/model-event transcripts from being falsely terminated by the historical 4 MiB retained-output limit while preserving Commit authority, Safe Contract v2 and Commit Receipt v4.\n\n${text}`;fs.writeFileSync('CHANGELOG.md',text);}
          NODE
          git rm .github/workflows/tmp-core-4.13.1-transcript.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(runtime): consume bounded Codex JSONL transcripts'
          git push origin HEAD:fix/core-4.13.1-transcript
