name: Prepare Release Branch

on:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: read

jobs:
  prepare:
    name: Sync release metadata
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Validate release branch
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
            echo "release branch must be release/vMAJOR.MINOR.PATCH: $GITHUB_REF_NAME" >&2
            exit 1
          }
          version="${GITHUB_REF_NAME#release/v}"
          package_version=$(node -p "require('./package.json').version")
          test "$package_version" = "$version" || {
            echo "package.json version $package_version does not match release branch $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Sync lockfile release metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (!lock.packages || !lock.packages['']) {
            throw new Error('package-lock.json is missing packages[""]');
          }
          lock.name = pkg.name;
          lock.version = pkg.version;
          lock.packages[''].name = pkg.name;
          lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
          npm run verify:lock
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Commit synchronized lockfile
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized for $VERSION."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m "chore: sync package lock for ${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
