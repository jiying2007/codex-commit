name: Bootstrap v1.2.1 release

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'release-bootstrap-v1.2.1'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: 051d6ad2e73eb8db050ee081ff48307cf26f18f4
      RELEASE_TAG: v1.2.1
      RELEASE_VERSION: 1.2.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Verify pinned release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          npm run verify:lock
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

  integration-latest:
    if: github.head_ref == 'release-bootstrap-v1.2.1'
    needs: validate
    name: Release Extension Host / ${{ matrix.os }} / latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_SHA: 051d6ad2e73eb8db050ee081ff48307cf26f18f4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Ensure Linux Extension Host dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v xvfb-run >/dev/null 2>&1 && ldconfig -p | grep -q 'libgtk-3.so' && ldconfig -p | grep -q 'libnss3.so'; then
            echo 'Extension Host dependencies already available.'
          else
            sudo apt-get update
            sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2
          fi
      - name: Run Extension Host integration tests on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a npm run test:integration
      - name: Run Extension Host integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration

  integration-minimum:
    if: github.head_ref == 'release-bootstrap-v1.2.1'
    needs: validate
    name: Release Extension Host / VS Code 1.90.0 minimum
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: 051d6ad2e73eb8db050ee081ff48307cf26f18f4
      VSCODE_TEST_VERSION: '1.90.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Ensure Linux Extension Host dependencies
        shell: bash
        run: |
          set -euo pipefail
          if command -v xvfb-run >/dev/null 2>&1 && ldconfig -p | grep -q 'libgtk-3.so' && ldconfig -p | grep -q 'libnss3.so'; then
            echo 'Extension Host dependencies already available.'
          else
            sudo apt-get update
            sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2
          fi
      - run: xvfb-run -a npm run test:integration

  release:
    if: github.head_ref == 'release-bootstrap-v1.2.1'
    needs: [validate, integration-latest, integration-minimum]
    name: Create v1.2.1 tag and GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_SHA: 051d6ad2e73eb8db050ee081ff48307cf26f18f4
      RELEASE_TAG: v1.2.1
      RELEASE_VERSION: 1.2.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and verify official bilingual VSIX
        shell: bash
        run: |
          set -euo pipefail
          npm run package
          vsix="codex-commit-safe-${RELEASE_VERSION}.vsix"
          unzip -Z1 "$vsix" > /tmp/vsix-files.txt
          grep -Fx 'extension/package.nls.json' /tmp/vsix-files.txt
          grep -Fx 'extension/package.nls.zh-cn.json' /tmp/vsix-files.txt
          grep -Fx 'extension/README.zh-CN.md' /tmp/vsix-files.txt
          if grep -E '^extension/(test|scripts|package-lock\.json|\.gitignore|\.gitattributes)' /tmp/vsix-files.txt; then
            echo 'VSIX contains development-only files' >&2
            exit 1
          fi
          sha256sum "$vsix" > SHA256SUMS
      - name: Create tag and GitHub Release atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="$RELEASE_SHA" >/dev/null
          if ! gh release create "$RELEASE_TAG" \
            "codex-commit-safe-${RELEASE_VERSION}.vsix" \
            SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Codex Commit Safe ${RELEASE_VERSION}" \
            --generate-notes \
            --verify-tag; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" || true
            exit 1
          fi
      - name: Delete temporary maintenance branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in maintenance-1.2.1 maintenance-1.2.1-validate maintenance-1.2.1-validate2 release-bootstrap-v1.2.1; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
          done
