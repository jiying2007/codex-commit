name: Finalize provider runtime
on:
  push:
    branches: [runtime-provider-v4.2.0]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Finalize and validate
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_SHA: ada3733a0d938b763fd241628da86990af7cfad7
          OLD_CORE_SHA: 0caabb91ad7f2bcedb9f3e5ac50ba4c68a315d46
        run: |
          set -euo pipefail
          git init .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "${GITHUB_REF_NAME}" --depth=1
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD
          git submodule update --init --recursive
          git -C src/codex-safe-core fetch origin "${CORE_SHA}" --depth=1
          git -C src/codex-safe-core checkout --detach "${CORE_SHA}"
          python3 scripts/finalize-runtime-provider.py
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git add -A
          git diff --cached --check
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run package
          rm .github/workflows/finalize-runtime-provider.yml scripts/finalize-runtime-provider.py
          git add -A
          git diff --cached --check
          git commit -m "feat: add shared Codex provider runtime"
          git push origin "HEAD:${GITHUB_REF_NAME}"
