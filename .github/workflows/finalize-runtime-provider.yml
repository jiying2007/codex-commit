name: Finalize provider runtime
on:
  push:
    branches: [runtime-provider-v4.2.0]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Finalize and validate
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_SHA: ada3733a0d938b763fd241628da86990af7cfad7
          OLD_CORE_SHA: 0caabb91ad7f2bcedb9f3e5ac50ba4c68a315d46
        run: |
          set -euo pipefail
          git init .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "${GITHUB_REF_NAME}" --depth=1
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD
          git submodule update --init --recursive
          git -C src/codex-safe-core fetch origin "${CORE_SHA}" --depth=1
          git -C src/codex-safe-core checkout --detach "${CORE_SHA}"
          python3 - <<'PY'
          import os
          from pathlib import Path
          core=os.environ['CORE_SHA']; old_core=os.environ['OLD_CORE_SHA']
          p=Path('package.json'); s=p.read_text(); s=s.replace('"version": "4.1.1"','"version": "4.2.0"',1)
          needle='''        "safeCodexCommit.model": {\n          "type": "string",\n          "default": "",\n          "scope": "application",\n          "description": "%config.model%"\n        },\n'''
          insert=needle+'''        "safeCodexCommit.providerMode": { "type": "string", "enum": ["openai", "openai-compatible"], "default": "openai", "scope": "application", "description": "Codex provider runtime: built-in OpenAI or an explicitly configured OpenAI-compatible Responses endpoint." },\n        "safeCodexCommit.providerBaseUrl": { "type": "string", "default": "", "scope": "application", "description": "HTTPS base URL for openai-compatible mode. User Codex config.toml is intentionally ignored." },\n        "safeCodexCommit.providerApiKeyEnv": { "type": "string", "default": "OPENAI_API_KEY", "scope": "application", "description": "Environment-variable name containing the provider API key; the secret value is never stored in settings." },\n        "safeCodexCommit.connectTimeoutSeconds": { "type": "number", "default": 15, "minimum": 1, "maximum": 120, "scope": "application", "description": "Provider connection timeout in seconds." },\n        "safeCodexCommit.requestTimeoutSeconds": { "type": "number", "default": 180, "minimum": 10, "maximum": 900, "scope": "application", "description": "Maximum time for one Codex request." },\n        "safeCodexCommit.operationTimeoutSeconds": { "type": "number", "default": 240, "minimum": 30, "maximum": 1200, "scope": "application", "description": "Whole Commit generation operation deadline." },\n        "safeCodexCommit.streamIdleTimeoutSeconds": { "type": "number", "default": 60, "minimum": 5, "maximum": 600, "scope": "application", "description": "Maximum provider response-stream idle time." },\n'''
          if '"safeCodexCommit.providerMode"' not in s:
            if needle not in s: raise SystemExit('package provider insertion anchor missing')
            s=s.replace(needle,insert,1)
          import re
          s=re.sub(r'\n\s*"safeCodexCommit\.timeoutSeconds"\s*:\s*\{.*?\n\s*\}', '', s, count=1, flags=re.S)
          p.write_text(s)

          p=Path('src/policy.js'); s=p.read_text()
          anchor='''    const language = project.language ?? config.get('language', 'zh-CN');'''
          runtime='''    const providerMode = String(getUserOnlySetting(config, 'providerMode', 'openai') || 'openai').trim();\n    const providerBaseUrl = String(getUserOnlySetting(config, 'providerBaseUrl', '') || '').trim();\n    const providerApiKeyEnv = String(getUserOnlySetting(config, 'providerApiKeyEnv', 'OPENAI_API_KEY') || 'OPENAI_API_KEY').trim();\n    if (!['openai','openai-compatible'].includes(providerMode)) throw new Error(ui('safeCodexCommit.providerMode 非法。','safeCodexCommit.providerMode is invalid.'));\n    if (!/^[A-Za-z_][A-Za-z0-9_]{0,127}$/.test(providerApiKeyEnv)) throw new Error(ui('safeCodexCommit.providerApiKeyEnv 非法。','safeCodexCommit.providerApiKeyEnv is invalid.'));\n    const codexRuntime = Object.freeze({\n      provider: Object.freeze({ mode: providerMode, baseUrl: providerBaseUrl, apiKeyEnv: providerApiKeyEnv }),\n      timeouts: Object.freeze({\n        connectMs: clampNumber(getUserOnlySetting(config,'connectTimeoutSeconds',15),15,1,120,'connectTimeoutSeconds')*1000,\n        requestMs: clampNumber(getUserOnlySetting(config,'requestTimeoutSeconds',180),180,10,900,'requestTimeoutSeconds')*1000,\n        operationMs: clampNumber(getUserOnlySetting(config,'operationTimeoutSeconds',240),240,30,1200,'operationTimeoutSeconds')*1000,\n        idleMs: clampNumber(getUserOnlySetting(config,'streamIdleTimeoutSeconds',60),60,5,600,'streamIdleTimeoutSeconds')*1000\n      })\n    });\n\n'''+anchor
          if 'const codexRuntime = Object.freeze' not in s:
            if anchor not in s: raise SystemExit('commit policy runtime anchor missing')
            s=s.replace(anchor,runtime,1)
          old="      timeoutSeconds: clampNumber(project.timeoutSeconds ?? config.get('timeoutSeconds', 90), 90, 10, 300, 'timeoutSeconds'),\n"
          s=s.replace(old,"      codexRuntime,\n",1)
          s=s.replace("      timeoutSeconds: options.timeoutSeconds,\n","      codexRuntime: options.codexRuntime,\n",1)
          p.write_text(s)

          p=Path('src/commit-runtime.js'); s=p.read_text()
          s=s.replace('''        timeoutMs: options.timeoutSeconds * 1000,\n        schema:''','''        runtime: options.codexRuntime,\n        schema:''',1)
          if 'probeCodexRuntime: request => cli.probeCodexRuntime(request),' not in s:
            s=s.replace('''    probeCodexCapabilities,\n    buildCodexArgs,''','''    probeCodexCapabilities,\n    probeCodexRuntime: request => cli.probeCodexRuntime(request),\n    buildCodexArgs,''',1)
          p.write_text(s)

          p=Path('extension.js'); s=p.read_text()
          s=s.replace('''const { formatCommitMessage, resolveCodexExecutable, probeCodexCapabilities, runCodex } = createCommitRuntime({ runPreparedProcess, ui });''','''const { formatCommitMessage, resolveCodexExecutable, probeCodexCapabilities, probeCodexRuntime, runCodex } = createCommitRuntime({ runPreparedProcess, ui });''',1)
          old='''  const resolved = await resolveCodexExecutable(options.codexPath);\n\n  let gitVersion = '';'''
          new='''  const runtime = await probeCodexRuntime({ codexPath: options.codexPath, model: options.model, runtime: options.codexRuntime });\n\n  let gitVersion = '';'''
          if old in s: s=s.replace(old,new,1)
          s=s.replace('''  await probeCodexCapabilities(resolved.executable, { requireModel: Boolean(options.model) });\n  log(`environment ok: codex=${resolved.version || 'detected'}, git=detected, cliCapabilities=ok`);\n  vscode.window.showInformationMessage(ui(\n    `Codex Commit Safe 环境正常：${resolved.version || resolved.executable}；${gitVersion}；必需 CLI 能力正常`,\n    `Codex Commit Safe environment is ready: ${resolved.version || resolved.executable}; ${gitVersion}; required CLI capabilities OK`\n  ));''','''  const endpoint = runtime.provider.endpointHost || 'Codex default';\n  log(`environment ok: codex=${runtime.codexVersion || 'detected'}, provider=${runtime.provider.mode}, endpoint=${endpoint}, liveProbeMs=${runtime.durationMs}`);\n  vscode.window.showInformationMessage(ui(\n    `Codex Commit Safe 环境正常：${runtime.codexVersion || options.codexPath}；${gitVersion}；Provider ${runtime.provider.mode} (${endpoint})；真实结构化探测 ${runtime.durationMs} ms`,\n    `Codex Commit Safe environment is ready: ${runtime.codexVersion || options.codexPath}; ${gitVersion}; provider ${runtime.provider.mode} (${endpoint}); live structured probe ${runtime.durationMs} ms`\n  ));''',1)
          p.write_text(s)

          p=Path('src/ui.js'); s=p.read_text()
          start=s.index('function friendlyError(error) {'); end=s.index('\n}\n\nmodule.exports',start)+2
          repl='''function friendlyError(error) {\n  const detail = error?.message || error?.stderr || String(error);\n  const provider = error?.provider;\n  const meta = provider ? ` Provider: ${provider.mode}${provider.endpointHost ? ` @ ${provider.endpointHost}` : ''}.` : '';\n  const timing = Number.isFinite(error?.elapsedMs) ? ` Elapsed: ${Math.round(error.elapsedMs / 100) / 10}s${Number.isFinite(error?.lastActivityMs) ? `; last activity ${Math.round(error.lastActivityMs / 100) / 10}s ago` : ''}.` : '';\n  const diagnostic = error?.diagnosticTail ? ` Diagnostic: ${String(error.diagnosticTail).slice(-1200)}` : '';\n  return `${detail}${meta}${timing}${diagnostic}`;\n}'''
          s=s[:start]+repl+s[end:]; p.write_text(s)

          for name,heading,text in [
            ('README.md','## Codex provider runtime','''Codex Commit Safe intentionally ignores `~/.codex/config.toml`. For a relay, configure `safeCodexCommit.providerMode=openai-compatible`, `providerBaseUrl`, and `providerApiKeyEnv`; the key itself stays in the named environment variable. Compatible endpoints use Responses HTTP/SSE. Environment Check performs a real structured round-trip.\n'''),
            ('README.zh-CN.md','## Codex Provider Runtime','''Codex Commit Safe 会主动忽略 `~/.codex/config.toml`。中转站使用 `safeCodexCommit.providerMode=openai-compatible`、`providerBaseUrl` 和 `providerApiKeyEnv`；Key 本身只保存在对应环境变量。兼容端点固定走 Responses HTTP/SSE，环境检查会真实完成一次结构化 round-trip。\n''')]:
            p=Path(name); x=p.read_text();
            if heading not in x: p.write_text(x.rstrip()+f'\n\n{heading}\n\n{text}')
          p=Path('CHANGELOG.md'); x=p.read_text(); marker='# Changelog\n'; entry='''\n## 4.2.0 - 2026-08-28\n\n- Consume Core v4.6 Codex Runtime/Provider Contract, add explicit OpenAI-compatible relay configuration, live Environment Check, split runtime timeouts and provider-aware diagnostics while keeping Safe Contract isolation.\n'''
          if '## 4.2.0 - 2026-08-28' not in x: p.write_text(x.replace(marker,marker+entry,1))
          for name in ['scripts/release.test.js','.codex-safe.example.json']:
            p=Path(name)
            if p.exists():
              x=p.read_text()
              if old_core in x: p.write_text(x.replace(old_core,core))
          PY
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git add -A
          git diff --cached --check
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
          rm .github/workflows/finalize-runtime-provider.yml
          git add -A
          git diff --cached --check
          git commit -m "feat: add shared Codex provider runtime"
          git push origin "HEAD:${GITHUB_REF_NAME}"
