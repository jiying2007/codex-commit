name: Final Loader Cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: final-loader-cleanup-${{ github.repository }}
  cancel-in-progress: false
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/final-loader-cleanup.js
      - name: Verify terminal product tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/safe-contract.js
          test ! -e src/safe-core-loader.js
          test ! -e src/safe-core-loader.d.ts
          test -e src/codex-safe-core/codex-cli.d.ts
          ! grep -R --line-number --fixed-strings 'safe-core-loader' src/commit-runtime.js tsconfig.pure.json package.json
          ! grep -R --line-number --fixed-strings 'safe-core-v1' src/codex-safe-core/manifest.json safe-core.lock.json docs/SAFE_CORE.md
          node scripts/safe-core.js verify
          npm run check
          npm run test:integration
          npm run package
      - run: rm scripts/final-loader-cleanup.js .github/workflows/final-loader-cleanup.yml
      - name: Commit terminal tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json tsconfig.pure.json docs/SAFE_CORE.md safe-core.lock.json src/commit-runtime.js src/codex-safe-core/manifest.json src/codex-safe-core/codex-cli.d.ts src/safe-core-loader.js src/safe-core-loader.d.ts scripts/final-loader-cleanup.js .github/workflows/final-loader-cleanup.yml
          git diff --cached --check
          git commit -m 'chore: remove final Safe Core transition bridges'
          git push origin HEAD:main
      - name: Delete final obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete safe-core-v1 || true
          git push origin --delete cleanup/remove-safe-core-loader-transition || true
