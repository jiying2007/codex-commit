name: Bootstrap v1.2.2 release

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.head_ref == 'release-bootstrap-1.2.2'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: cec47abdaf98c122b3bc56bff46252b566aa5d07
      RELEASE_TAG: v1.2.2
      RELEASE_VERSION: 1.2.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Verify pinned release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./package-lock.json').version")" = "$RELEASE_VERSION"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          npm run verify:lock
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Build and verify official VSIX
        shell: bash
        run: |
          set -euo pipefail
          npm run package
          vsix="codex-commit-safe-${RELEASE_VERSION}.vsix"
          test -f "$vsix"
          unzip -Z1 "$vsix" > /tmp/vsix-files.txt
          grep -Fx 'extension/package.nls.json' /tmp/vsix-files.txt
          grep -Fx 'extension/package.nls.zh-cn.json' /tmp/vsix-files.txt
          grep -Fx 'extension/README.zh-CN.md' /tmp/vsix-files.txt
          sha256sum "$vsix" > SHA256SUMS

      - name: Create v1.2.2 tag and GitHub Release atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="$RELEASE_SHA" >/dev/null
          if ! gh release create "$RELEASE_TAG" \
            "codex-commit-safe-${RELEASE_VERSION}.vsix" \
            SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Codex Commit Safe ${RELEASE_VERSION}" \
            --generate-notes \
            --verify-tag; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" || true
            exit 1
          fi

      - name: Retire release bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/release-bootstrap-1.2.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove v1.2.2 release bootstrap"
          git push origin HEAD:main
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/release-bootstrap-1.2.2" >/dev/null 2>&1 || true
