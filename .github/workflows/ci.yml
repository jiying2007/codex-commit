name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit / regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run verify:lock
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check

  integration-linux:
    name: Extension Host / Linux
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Extension Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2
      - run: xvfb-run -a npm run test:integration

  integration-windows:
    name: Extension Host / Windows
    needs: unit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply candidate cmd.exe verbatim-argument fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('extension.js')
          s=p.read_text()
          old="""  return {
    command: process.env.ComSpec || 'cmd.exe',
    args: ['/d', '/s', '/c', commandLine],
    shell: false
  };
"""
          new="""  return {
    command: process.env.ComSpec || 'cmd.exe',
    args: ['/d', '/s', '/c', commandLine],
    shell: false,
    windowsVerbatimArguments: true
  };
"""
          assert old in s
          s=s.replace(old,new,1)
          old="""    { ...options, shell: false },
    stdinText,
"""
          new="""    {
      ...options,
      shell: false,
      windowsVerbatimArguments: prepared.windowsVerbatimArguments === true
    },
    stdinText,
"""
          assert old in s
          s=s.replace(old,new,1)
          old="""        windowsHide: true,
        shell: options.shell === true,
        detached: process.platform !== 'win32'
"""
          new="""        windowsHide: true,
        shell: options.shell === true,
        windowsVerbatimArguments: options.windowsVerbatimArguments === true,
        detached: process.platform !== 'win32'
"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check extension.js
      - run: npm run test:integration

  package:
    name: Official VSIX package
    needs: [integration-linux, integration-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run package
      - name: Create SHA256
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          sha256sum "codex-commit-safe-${version}.vsix" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: codex-commit-safe-${{ github.sha }}
          path: |
            codex-commit-safe-*.vsix
            SHA256SUMS
          if-no-files-found: error
