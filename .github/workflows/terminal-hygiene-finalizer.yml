name: Terminal Hygiene Finalizer

on:
  push:
    branches: [cleanup/terminal-hygiene]

permissions:
  contents: write

concurrency:
  group: terminal-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cleanup/terminal-hygiene
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply fail-closed terminal hygiene
        run: node scripts/terminal-hygiene-codemod.js
      - name: Verify no wrapper residue
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/safe-contract.js
          ! grep -R --line-number --fixed-strings "./src/safe-contract" extension.js src test scripts package.json
      - run: npm run check
      - run: npm run package
      - name: Remove one-time hygiene machinery
        run: rm scripts/terminal-hygiene-codemod.js .github/workflows/terminal-hygiene-finalizer.yml
      - name: Commit finalized hygiene
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- extension.js package.json src/safe-contract.js scripts/terminal-hygiene-codemod.js .github/workflows/terminal-hygiene-finalizer.yml
          git diff --cached --check
          git commit -m 'chore: remove Safe Core compatibility wrapper'
          git push origin HEAD:cleanup/terminal-hygiene
