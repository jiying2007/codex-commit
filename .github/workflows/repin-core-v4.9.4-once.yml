name: Repin Commit Core v4.9.4 once
on:
  push:
permissions:
  contents: write
jobs:
  repin:
    if: github.ref == 'refs/heads/repin-core-v4.9.4'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repin-core-v4.9.4
          persist-credentials: true
      - name: Repin trust root and current schema examples
        env:
          OLD_SHA: 2011591e76cf73c0890b702a5bcd3499de91bbbc
          LEGACY_SCHEMA_SHA: 10393a0035ce5168b3d0e88822af0d74fe85ec6c
          NEW_SHA: bc367cf3fbc57d7060bce343fcf4a6d5312f7ab8
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),old=process.env.OLD_SHA,legacy=process.env.LEGACY_SCHEMA_SHA,neu=process.env.NEW_SHA;
          const pc=JSON.parse(fs.readFileSync('product-contract.json','utf8'));pc.safeCoreVersion='4.9.4';pc.safeCoreCommit=neu;fs.writeFileSync('product-contract.json',JSON.stringify(pc,null,2)+'\n');
          for(const p of ['.codex-safe.example.json','SUPPORT.md']){let s=fs.readFileSync(p,'utf8').replaceAll(old,neu).replaceAll('v4.9.3','v4.9.4');fs.writeFileSync(p,s);}
          for(const p of ['README.md','README.zh-CN.md']){let s=fs.readFileSync(p,'utf8').replaceAll(legacy,neu);fs.writeFileSync(p,s);}
          NODE
          git update-index --cacheinfo 160000,$NEW_SHA,src/codex-safe-core
          git config user.name jiying2007
          git config user.email 33591504+jiying2007@users.noreply.github.com
          git add product-contract.json .codex-safe.example.json SUPPORT.md README.md README.zh-CN.md
          git add -u src/codex-safe-core
          git commit -m 'chore(family): pin Commit to Core v4.9.4 and refresh schema examples'
          git push origin HEAD:repin-core-v4.9.4
