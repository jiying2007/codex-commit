name: Fix Windows cmd quoting

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'trigger-windows-cmd-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch cmd /s /c quoting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('extension.js')
          s=p.read_text()
          old="  const commandLine = [quoteWindowsCmdArg(command), ...args.map(quoteWindowsCmdArg)].join(' ');"
          new="  const commandLine = '\"' + [quoteWindowsCmdArg(command), ...args.map(quoteWindowsCmdArg)].join(' ') + '\"';"
          if old not in s:
              raise SystemExit('expected prepareCommand line not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check extension.js
          grep -F "const commandLine = '\"' +" extension.js
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension.js
          git commit -m "fix: preserve Windows cmd script quoting"
          git push origin HEAD:main
