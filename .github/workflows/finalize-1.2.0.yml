name: Finalize 1.2.0 source

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'trigger-finalize-1.2.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct verified 1.2.0 source
        shell: bash
        run: |
          set -euo pipefail
          cat .release/part-* > /tmp/release.b64
          base64 -d /tmp/release.b64 > /tmp/release.tar.gz
          echo "c340eff2e99a12765ad99f940d0e3ee0803dc30cfbf975a8e4db36e6718cdf3b  /tmp/release.tar.gz" | sha256sum -c -
          tmp=$(mktemp -d)
          tar -xzf /tmp/release.tar.gz -C "$tmp"
          cp -a "$tmp"/. .
          sed -i "s/getConfiguration('codexCommit'/getConfiguration('safeCodexCommit'/g" extension.js test/integration/suite/integration.test.js
          sed -i 's/Codex Commit 1\.1\.6 unit\/regression tests passed\./Codex Commit Safe 1.2.0 unit\/regression tests passed./g' test.js
          sed -i 's/Codex Commit 1\.1\.6 Extension Host integration tests passed\./Codex Commit Safe 1.2.0 Extension Host integration tests passed./g' test/integration/suite/integration.test.js
          sed -i 's/codex-commit-1\.1\.6\.vsix/codex-commit-safe-1.2.0.vsix/g' README.md
          printf '\nnode_modules/\n.vscode-test/\n*.vsix\nSHA256SUMS\n' >> .gitignore
          awk '!seen[$0]++' .gitignore > .gitignore.tmp && mv .gitignore.tmp .gitignore
          if grep -R "codexCommit\|1\.1\.6" -n extension.js package.json test.js test README.md SECURITY.md CHANGELOG.md; then
            echo "legacy identity/version reference remains" >&2
            exit 1
          fi

      - name: Generate and verify lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm run verify:lock
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Unit and regression checks
        run: npm run check

      - name: Install Extension Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2

      - name: Extension Host integration tests
        run: xvfb-run -a npm run test:integration

      - name: Official VSIX package
        run: npm run package

      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore LICENSE README.md SECURITY.md CHANGELOG.md extension.js package.json package-lock.json scripts test.js test images .gitlab-ci.yml .vscodeignore .codex-commit.example.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "release: finalize Codex Commit Safe 1.2.0 source"
            git push origin HEAD:main
          fi
