name: Temporary Commit 4.5.5 Finalizer

on:
  push:
    branches: [fix/marketplace-core-4.15]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/marketplace-core-4.15
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Bump exact release identity without dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const oldVersion='4.5.4', newVersion='4.5.5';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); pkg.version=newVersion; fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')); lock.version=newVersion; if(lock.packages?.['']) lock.packages[''].version=newVersion; fs.writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n');
          const contract=JSON.parse(fs.readFileSync('product-contract.json','utf8')); contract.productVersion=newVersion; fs.writeFileSync('product-contract.json',JSON.stringify(contract,null,2)+'\n');
          const docs=['README.md','README.zh-CN.md','SUPPORT.md','SECURITY.md','PUBLISHING.md','VERIFY_RELEASE.md','docs/GETTING_STARTED.md','docs/GETTING_STARTED.zh-CN.md'];
          for(const file of docs){ if(!fs.existsSync(file)) continue; let s=fs.readFileSync(file,'utf8'); s=s.split(oldVersion).join(newVersion); fs.writeFileSync(file,s); }
          let ch=fs.readFileSync('CHANGELOG.md','utf8');
          if(!ch.startsWith('## 4.5.5')) ch=`## 4.5.5 - 2026-09-04\n\n- Repair the VS Code Marketplace distribution-receipt reusable-workflow pin to immutable Codex Safe Core 4.15.0 while preserving the exact 4.15.0 runtime gitlink and Product Contract.\n- Publish a new exact-SHA patch release because the immutable 4.5.4 GitHub Release cannot be mutated and Family readiness requires Marketplace distribution evidence bound to the same main/release SHA.\n\n${ch}`;
          fs.writeFileSync('CHANGELOG.md',ch);
          NODE
          git config user.name 'codex-safe-family-bot'
          git config user.email 'codex-safe-family-bot@users.noreply.github.com'
          git add package.json package-lock.json product-contract.json CHANGELOG.md README.md README.zh-CN.md SUPPORT.md SECURITY.md PUBLISHING.md VERIFY_RELEASE.md docs/GETTING_STARTED.md docs/GETTING_STARTED.zh-CN.md 2>/dev/null || true
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'chore(release): prepare Codex Commit Safe 4.5.5'
          git push origin HEAD:fix/marketplace-core-4.15
