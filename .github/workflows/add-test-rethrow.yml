name: Add test-mode error propagation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'trigger-test-rethrow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch generate test error propagation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('extension.js')
          s=p.read_text()
          old="""        if (error?.code !== 'ECANCELLED') {
          vscode.window.showErrorMessage(`Codex Commit Safe 生成失败：${friendlyError(error)}`);
        }
"""
          new="""        if (error?.code !== 'ECANCELLED') {
          vscode.window.showErrorMessage(`Codex Commit Safe 生成失败：${friendlyError(error)}`);
        }
        if (extensionMode === vscode.ExtensionMode.Test) throw error;
"""
          if old not in s:
              raise SystemExit('expected generate catch block not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check extension.js
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension.js
          git commit -m "test: propagate generation errors in Extension Host"
          git push origin HEAD:main
