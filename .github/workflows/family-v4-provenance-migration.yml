name: Family v4 Provenance Migration

on:
  push:
    branches: [family-terminal-hardening]
    paths: [.github/workflows/family-v4-provenance-migration.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: family-terminal-hardening
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - name: Apply exact provenance transformation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          function replaceOnce(file, before, after) {
            let text = fs.readFileSync(file, 'utf8');
            if (!text.includes(before)) throw new Error(`${file}: expected source fragment not found`);
            text = text.replace(before, after);
            fs.writeFileSync(file, text);
          }
          replaceOnce('src/commit-runtime.js',
            '      return validateStructuredResult(result.parsed, options);',
            `      const structured = validateStructuredResult(result.parsed, options);\n      Object.defineProperty(structured, 'executionMeta', {\n        value: Object.freeze({\n          codexVersion: result.resolved?.version || 'unknown',\n          requestedModel: options.model || '',\n          resolvedModel: options.model || ''\n        }),\n        enumerable: false, configurable: false, writable: false\n      });\n      return structured;`);
          replaceOnce('extension.js',
            `        model: options.model || 'cli-default',\n        createdAt: new Date().toISOString(),`,
            `        model: generationResult.structured.executionMeta?.resolvedModel || options.model || 'cli-default',\n        requestedModel: generationResult.structured.executionMeta?.requestedModel || options.model || '',\n        resolvedModel: generationResult.structured.executionMeta?.resolvedModel || options.model || '',\n        codexVersion: generationResult.structured.executionMeta?.codexVersion || 'unknown',\n        createdAt: new Date().toISOString(),`);
          replaceOnce('extension.js',
            `if (!receipt) throw new Error('Generated Commit receipt failed v2 validation.');`,
            `if (!receipt) throw new Error('Generated Commit Receipt v4 failed validation.');`);
          replaceOnce('test/commit-runtime.test.js',
            `  assert.deepStrictEqual(result, structured);`,
            `  assert.deepStrictEqual(result, structured);\n  assert.deepStrictEqual(result.executionMeta, { codexVersion: 'codex-cli 1.2.3', requestedModel: '', resolvedModel: '' });`);
          NODE
          git rm .github/workflows/family-v4-provenance-migration.yml
          git diff --check
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/commit-runtime.js extension.js test/commit-runtime.test.js
          git commit -m 'feat: record actual Codex execution provenance'
          git push origin HEAD:family-terminal-hardening
