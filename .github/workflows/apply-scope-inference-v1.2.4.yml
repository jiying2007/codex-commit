name: Apply scope inference v1.2.4

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  apply:
    if: github.head_ref == 'fix/scope-inference-v1.2.4' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/scope-inference-v1.2.4
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply scope inference hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-scope-inference-v1.2.4.py
          rm scripts/apply-scope-inference-v1.2.4.py
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm run verify:lock
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Commit hardened branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension.js package.json package-lock.json test.js package.nls.json package.nls.zh-cn.json README.md README.zh-CN.md CHANGELOG.md
          git add -u -- scripts/apply-scope-inference-v1.2.4.py
          git diff --cached --check
          git commit -m 'fix: improve scope inference accuracy'
          git push origin HEAD:fix/scope-inference-v1.2.4
