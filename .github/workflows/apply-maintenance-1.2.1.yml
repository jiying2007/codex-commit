name: Apply 1.2.1 maintenance closure

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'maintenance-1.2.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: maintenance-1.2.1
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply verified source tree
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .maintenance ]; then
            echo 'Maintenance source already applied.'
            exit 0
          fi
          cat .maintenance/part-* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          echo '03fba1645839b9b8bbea8830a2d95133e44b6f8855fb488ebdec763ae96a7431  /tmp/source.tar.gz' | sha256sum -c -
          tmp=$(mktemp -d)
          tar -xzf /tmp/source.tar.gz -C "$tmp"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .maintenance -exec rm -rf {} +
          cp -a "$tmp"/. .
          rm -rf .maintenance
          npm run verify:lock
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run package
      - name: Commit verified 1.2.1 source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: prepare Codex Commit Safe 1.2.1'
          git push origin HEAD:maintenance-1.2.1

  integration-latest:
    name: Extension Host / ${{ matrix.os }} latest
    needs: apply
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: maintenance-1.2.1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm run verify:lock
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Linux Extension Host dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2
      - name: Run Extension Host integration tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Run Extension Host integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration

  integration-minimum:
    name: Extension Host / VS Code 1.90.0 minimum
    needs: apply
    runs-on: ubuntu-latest
    env:
      VSCODE_TEST_VERSION: 1.90.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: maintenance-1.2.1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2
      - run: xvfb-run -a npm run test:integration

  package-verify:
    name: Official VSIX / bilingual content
    needs: [integration-latest, integration-minimum]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: maintenance-1.2.1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run package
      - name: Verify packaged content
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          vsix="codex-commit-safe-${version}.vsix"
          unzip -l "$vsix" > /tmp/vsix.list
          grep -F 'extension/package.nls.json' /tmp/vsix.list
          grep -F 'extension/package.nls.zh-cn.json' /tmp/vsix.list
          grep -F 'extension/README.zh-CN.md' /tmp/vsix.list
          if grep -E 'extension/(test|scripts|package-lock\.json|\.gitignore|\.gitattributes)(/|$)' /tmp/vsix.list; then
            echo 'VSIX contains development-only files.' >&2
            exit 1
          fi
          sha256sum "$vsix" > SHA256SUMS
