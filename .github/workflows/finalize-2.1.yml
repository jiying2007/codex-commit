# final-product-only: eadca528e4d5470014fdb76c0138a299ff2119f4
name: Finalize 2.1
on:
  push:
    paths: ['.github/workflows/finalize-2.1.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  statuses: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Prepare 2.1.0 product changes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const version='2.1.0';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version=version;
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          let c=fs.readFileSync('CHANGELOG.md','utf8');
          if(!c.includes('\n## 2.1.0\n')){
            const marker='## Unreleased'; const start=c.indexOf(marker); const next=c.indexOf('\n## ',start+marker.length);
            if(start<0||next<0) throw new Error('CHANGELOG structure invalid');
            const old=c.slice(start+marker.length,next).trim();
            const notes=[
              '- Pin Codex Safe Core 2.1 as the canonical policy/process/Git/context/contract runtime.',
              '- Split Commit UI, repository selection, policy merge, and Review-evidence adapters out of the extension entry; remove the extension.__test compatibility surface.',
              '- Fix Commit Receipt diff fingerprint generation to await the async Core fingerprint helper.',
              '- Remove redundant product process-runner proxy/tests and the stale TypeScript checkJs dual-track; validate the JavaScript runtime through syntax, production-module, Extension Host, bundle and VSIX gates.'
            ].join('\n');
            c=c.slice(0,start+marker.length)+'\n\n## 2.1.0\n\n'+notes+(old?'\n'+old:'')+'\n'+c.slice(next);
            fs.writeFileSync('CHANGELOG.md',c);
          }
          let test=fs.readFileSync('test/git-repository.test.js','utf8');
          for (const [from,to] of [
            ['.codex-commit.json', '.codex-safe.json'],
            ['{\"language\":\"en\",\"styleHistoryLimit\":12}', '{\"schemaVersion\":2,\"commit\":{\"language\":\"en\",\"styleHistoryLimit\":12}}'],
            ['{\"codexPath\":\"evil\"}', '{\"schemaVersion\":2,\"commit\":{\"codexPath\":\"evil\"}}']
          ]) {
            if (!test.includes(from)) throw new Error(`expected legacy fixture not found: ${from}`);
            test=test.split(from).join(to);
          }
          fs.writeFileSync('test/git-repository.test.js',test);
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm run verify:lock
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact pinned Safe Core
        run: cd src/codex-safe-core && npm run check
      - run: npm run check
      - run: sudo apt-get update && (sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2)
      - run: xvfb-run -a npm run test:integration
      - run: npm run package
      - name: Commit validated 2.1.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md test/git-repository.test.js
          git commit -m 'release!: Codex Commit Safe 2.1.0'
          git push origin HEAD:main
      - name: Dispatch and verify permanent CI and Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          gh workflow run ci.yml --ref main
          gh workflow run release.yml --ref main
          wait_run(){ local wf="$1" id=''; for _ in $(seq 1 30); do id=$(gh run list --workflow "$wf" --branch main --event workflow_dispatch --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$head\") | .databaseId" | head -n1); [ -n "$id" ] && { echo "$id"; return 0; }; sleep 2; done; return 1; }
          ci=$(wait_run ci.yml); rel=$(wait_run release.yml)
          verify(){ local id="$1" context="$2" state=success; gh run watch "$id" --exit-status || state=failure; gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head}" -f state="$state" -f context="$context" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${id}" >/dev/null; [ "$state" = success ]; }
          verify "$ci" 'ci-2.1-final'
          verify "$rel" 'release-2.1-final'
      - name: Expose finalizer failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='finalize-2.1' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
