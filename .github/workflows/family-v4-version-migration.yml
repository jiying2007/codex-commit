name: Family v4 Version Migration
on:
  push:
    branches: [family-terminal-hardening]
    paths: [.github/workflows/family-v4-version-migration.yml]
permissions: { contents: write }
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: family-terminal-hardening, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['package.json','package-lock.json']){const x=JSON.parse(fs.readFileSync(file,'utf8'));x.version='4.0.0';if(file==='package-lock.json'&&x.packages?.[''])x.packages[''].version='4.0.0';fs.writeFileSync(file,JSON.stringify(x,null,2)+'\n');}
          let c=fs.readFileSync('CHANGELOG.md','utf8');
          if(!c.includes('## 4.0.0')) c=c.replace('## Unreleased\n\n','## Unreleased\n\n## 4.0.0\n\n### Changed\n\n- Hard-switch to Safe Core 4.0.0 and Commit/Review Receipt v4; old Receipt storage is not migrated.\n- Record actual Codex CLI execution provenance plus requested/resolved model identity in Commit Receipt v4.\n- Align manifest localization with Review/PR and add immutable VSIX + SPDX SBOM + SHA256 + provenance release governance.\n\n');
          fs.writeFileSync('CHANGELOG.md',c);
          NODE
          git rm .github/workflows/family-v4-version-migration.yml
          git diff --check
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md
          git commit -m 'release: prepare Commit Safe 4.0.0'
          git push origin HEAD:family-terminal-hardening
