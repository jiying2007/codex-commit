name: Final Transition Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: final-transition-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply final transition cleanup
        run: node scripts/final-transition-cleanup.js
      - name: Verify final product tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/safe-contract.js
          test ! -e src/safe-core-loader.js
          test ! -e src/safe-core-loader.d.ts
          test -e src/codex-safe-core/codex-cli.d.ts
          ! grep -R --line-number --fixed-strings 'safe-core-v1' src/codex-safe-core safe-core.lock.json docs/SAFE_CORE.md
          node scripts/safe-core.js verify
          npm run check
          npm run package
      - name: Remove one-time cleanup machinery
        run: rm scripts/final-transition-cleanup.js .github/workflows/final-transition-cleanup.yml
      - name: Commit terminal tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- extension.js package.json tsconfig.pure.json docs/SAFE_CORE.md safe-core.lock.json src/codex-safe-core/manifest.json src/codex-safe-core/codex-cli.d.ts src/commit-runtime.js src/safe-contract.js src/safe-core-loader.js src/safe-core-loader.d.ts test/commit-runtime.test.js scripts/final-transition-cleanup.js .github/workflows/final-transition-cleanup.yml
          git diff --cached --check
          git commit -m 'chore: remove compatibility transition residue'
          git push origin HEAD:main
      - name: Delete obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            build/typecheck-pure-modules \
            cleanup/terminal-hygiene \
            codex/adopt-safe-core-v1 \
            codex/remove-transition-residue \
            cleanup/final-transition-removal \
            feat/style-intelligence-bundle \
            feat/vscode-best-practices \
            refactor/git-codex-runtime \
            refactor/git-safe-core-adapter \
            refactor/policy-validation \
            refactor/process-runner \
            refactor/scope-module \
            safe-core-v1; do
            git push origin --delete "$branch" || true
          done
