name: Temporary Core 4.15 Repin

on:
  push:
    branches: [chore/core-4.15]

permissions:
  contents: write

jobs:
  repin:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/core-4.15
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Canonical contents-only release-bearing repin
        shell: bash
        run: |
          set -euo pipefail
          core=e962826ee6556fd8ffa74ab1994bf43d62826f10
          git -C src/codex-safe-core fetch origin "$core"
          git -C src/codex-safe-core checkout --detach "$core"
          node src/codex-safe-core/scripts/repin-consumer.js "$PWD" "$core"
          git restore .github/workflows/family-release-guard.yml
          git config user.name 'codex-safe-family-bot'
          git config user.email 'codex-safe-family-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(family): repin to Core 4.15.0'
          git push origin HEAD:chore/core-4.15
