name: Apply Scope Intelligence config edge

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  apply:
    if: github.head_ref == 'fix/scope-intelligence-config-edge' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/scope-intelligence-config-edge
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-scope-intelligence-config-edge.py
          rm scripts/apply-scope-intelligence-config-edge.py
          npm run verify:lock
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          git diff --check
      - name: Commit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- extension.js test.js CHANGELOG.md
          git add -u -- scripts/apply-scope-intelligence-config-edge.py
          git diff --cached --check
          git commit -m 'fix: handle project scope overrides safely'
          git push origin HEAD:fix/scope-intelligence-config-edge
