name: VS Code Marketplace

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish, for example v1.2.3'
        required: true

permissions:
  contents: read

concurrency:
  group: vscode-marketplace-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve immutable release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag must be vMAJOR.MINOR.PATCH: $tag" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "${{ steps.release.outputs.version }}"
          test "$(node -p "require('./package.json').publisher")" = "jiying2007"
          test "$(node -p "require('./package.json').name")" = "codex-commit-safe"
          npm run verify:lock
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Build and verify Marketplace VSIX
        shell: bash
        run: |
          set -euo pipefail
          npm run package
          vsix="codex-commit-safe-${{ steps.release.outputs.version }}.vsix"
          test -f "$vsix"
          unzip -Z1 "$vsix" > /tmp/vsix-files.txt
          grep -Fx 'extension/package.nls.json' /tmp/vsix-files.txt
          grep -Fx 'extension/package.nls.zh-cn.json' /tmp/vsix-files.txt
          grep -Fx 'extension/README.zh-CN.md' /tmp/vsix-files.txt
          grep -Fx 'extension/dist/extension.js' /tmp/vsix-files.txt
          grep -Fx 'extension/schemas/codex-commit.schema.json' /tmp/vsix-files.txt
          if grep -E '^extension/(extension\.js|src/|test|scripts|package-lock\.json|\.gitignore|\.gitattributes)' /tmp/vsix-files.txt; then
            echo 'VSIX contains development-only files' >&2
            exit 1
          fi
          sha256sum "$vsix"

      - name: Publish Marketplace extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VSCE_PAT:-}" || {
            echo 'VSCE_PAT is required for Marketplace publishing. Configure the repository secret before running this workflow.' >&2
            exit 1
          }
          vsix="codex-commit-safe-${{ steps.release.outputs.version }}.vsix"
          ./node_modules/.bin/vsce publish --packagePath "$vsix" --pat "$VSCE_PAT" --skip-duplicate
