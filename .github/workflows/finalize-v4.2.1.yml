name: Finalize Core v4.2.1 adoption
on:
  push:
    branches: [family-governance-v4.2.0]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Finalize exact pin and minimal package diff
        env:
          CORE_SHA: 1755262f51d5e15d74e432add38863d2383bb495
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git -C src/codex-safe-core fetch origin "$CORE_SHA"
          git -C src/codex-safe-core checkout --detach "$CORE_SHA"
          git show origin/main:package.json > package.json
          node <<'NODE'
          const fs=require('fs'); const sha=process.env.CORE_SHA;
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.scripts.governance='node src/codex-safe-core/scripts/verify-actions-pins.js .github/workflows && node src/codex-safe-core/scripts/verify-non-goals.js .';
          p.scripts.diagnostics='node src/codex-safe-core/scripts/family-diagnostics.js';
          p.scripts.check=p.scripts.check.replace('npm run test:unit','npm run governance && npm run test:unit');
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          const ex='.codex-safe.example.json', v=JSON.parse(fs.readFileSync(ex,'utf8')); v.$schema=v.$schema.replace(/[0-9a-f]{40}(?=\/codex-safe\.schema\.json)/i,sha); fs.writeFileSync(ex,JSON.stringify(v,null,2)+'\n');
          const vf='scripts/verify-manifest.js'; let t=fs.readFileSync(vf,'utf8'); t=t.replace(/const EXPECTED_CORE_COMMIT = '[0-9a-f]{40}';/,`const EXPECTED_CORE_COMMIT = '${sha}';`); fs.writeFileSync(vf,t);
          NODE
          git add package.json .codex-safe.example.json scripts/verify-manifest.js src/codex-safe-core
          git diff --cached --quiet && exit 0
          git commit -m 'chore: finalize Codex Safe Core v4.2.1 adoption'
          git push origin HEAD:family-governance-v4.2.0
