name: Family migration bootstrap
on:
  push:
    branches: [family/judgment-lifecycle-v1]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: family/judgment-lifecycle-v1
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Apply deterministic Commit 4.3.0 migration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const version='4.3.0',coreVersion='4.11.0',coreSha='8375907712db37492aff1ac0d0013e2753b1f6ab';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version=version;fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));lock.version=version;if(lock.packages?.[''])lock.packages[''].version=version;fs.writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n');
          const pc=JSON.parse(fs.readFileSync('product-contract.json','utf8'));Object.assign(pc,{productVersion:version,safeCoreVersion:coreVersion,safeCoreCommit:coreSha,reviewReceiptVersion:5,judgmentLifecycleVersionConsumed:1});fs.writeFileSync('product-contract.json',JSON.stringify(pc,null,2)+'\n');
          if(fs.existsSync('.codex-safe.example.json')){const value=JSON.parse(fs.readFileSync('.codex-safe.example.json','utf8'));if(value.$schema)value.$schema=`https://raw.githubusercontent.com/jiying2007/codex-safe-core/${coreSha}/codex-safe.schema.json`;fs.writeFileSync('.codex-safe.example.json',JSON.stringify(value,null,2)+'\n');}
          let manifest=fs.readFileSync('scripts/verify-manifest.js','utf8');
          manifest=manifest.replace('REVIEW_RECEIPT_SCHEMA_VERSION !== 4 || COMMIT_RECEIPT_SCHEMA_VERSION !== 4','REVIEW_RECEIPT_SCHEMA_VERSION !== 5 || COMMIT_RECEIPT_SCHEMA_VERSION !== 4');
          manifest=manifest.replace('Review/Commit Receipt 4 and Commit Prompt Contract 1','Review Receipt 5, Commit Receipt 4 and Commit Prompt Contract 1');
          manifest=manifest.replace('Receipt v4, Prompt Contract v1','Review Receipt v5 / Commit Receipt v4, Prompt Contract v1');
          fs.writeFileSync('scripts/verify-manifest.js',manifest);
          let changelog=fs.readFileSync('CHANGELOG.md','utf8');
          if(!changelog.startsWith('## 4.3.0\n'))changelog=`## 4.3.0\n\n- Adopt immutable Safe Core 4.11.0 and consume Review Receipt v5 / Judgment Lifecycle v1 provenance.\n- Keep Commit message generation fresh-only; no Judgment replay or model-result persistence is introduced.\n- Treat only current-session Review provenance as current when attaching Review evidence to Commit receipts.\n\n${changelog}`;
          fs.writeFileSync('CHANGELOG.md',changelog);
          NODE
          rm .github/workflows/family-migration-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(commit): finalize 4.3.0 family migration'
          git push origin HEAD:family/judgment-lifecycle-v1
