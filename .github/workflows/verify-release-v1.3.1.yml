name: Verify and finalize v1.3.1 release

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-and-cleanup:
    if: github.head_ref == 'verify-release-v1.3.1-trigger' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify immutable tag and GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.3.1
          EXPECTED_SHA: 7c348c3797c25223b99bcca693a1ae0ea2fd11e7
        shell: bash
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')
          test "$tag_sha" = "$EXPECTED_SHA"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,publishedAt,url
          mkdir -p /tmp/release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/release-assets --pattern 'codex-commit-safe-1.3.1.vsix' --pattern 'SHA256SUMS'
          cd /tmp/release-assets
          test -f codex-commit-safe-1.3.1.vsix
          test -f SHA256SUMS
          echo '--- SHA256SUMS ---'
          cat SHA256SUMS
          echo '--- Actual SHA256 ---'
          sha256sum codex-commit-safe-1.3.1.vsix
          sha256sum -c SHA256SUMS
          unzip -Z1 codex-commit-safe-1.3.1.vsix > /tmp/vsix-files.txt
          grep -Fx 'extension/package.nls.json' /tmp/vsix-files.txt
          grep -Fx 'extension/package.nls.zh-cn.json' /tmp/vsix-files.txt
          grep -Fx 'extension/README.zh-CN.md' /tmp/vsix-files.txt
          if grep -E '^extension/(test|scripts|package-lock\.json|\.gitignore|\.gitattributes)' /tmp/vsix-files.txt; then
            echo 'VSIX contains development-only files' >&2
            exit 1
          fi
      - name: Remove temporary verifier and release branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-release-v1.3.1.yml
          git commit -m 'build: finalize v1.3.1 release'
          git push origin HEAD:main
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" || true
          git push origin --delete release/v1.3.1 || true
          git push origin --delete verify-release-v1.3.1-trigger || true
