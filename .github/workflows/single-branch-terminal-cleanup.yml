name: Single Branch Terminal Cleanup

on:
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: single-branch-terminal-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.head_ref == 'cleanup/safe-core-single-branch-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Verify inventory and delete reviewed branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t actual < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$' | sort)
          mapfile -t allowed < <(printf '%s\n' \
            'chore/safe-core-main-canonical' \
            'chore/safe-core-main-source' \
            'cleanup/execute-terminal-self-cleaner' \
            'cleanup/remove-safe-core-loader-transition' \
            'cleanup/safe-core-single-branch-trigger' \
            'cleanup/trigger-final-loader-cleanup' \
            'main' \
            'safe-core-v1' | sort)
          unknown=$(comm -23 <(printf '%s\n' "${actual[@]}") <(printf '%s\n' "${allowed[@]}") || true)
          if [[ -n "$unknown" ]]; then
            echo 'Unknown remote branches detected; refusing cleanup:' >&2
            echo "$unknown" >&2
            exit 1
          fi
          for branch in \
            safe-core-v1 \
            chore/safe-core-main-canonical \
            chore/safe-core-main-source \
            cleanup/execute-terminal-self-cleaner \
            cleanup/remove-safe-core-loader-transition \
            cleanup/trigger-final-loader-cleanup; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
          git fetch --prune origin
          remaining=$(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$' | sort)
          expected=$'cleanup/safe-core-single-branch-trigger\nmain'
          if [[ "$remaining" != "$expected" ]]; then
            echo 'Unexpected branch inventory after deletion:' >&2
            printf '%s\n' "$remaining" >&2
            exit 1
          fi
      - name: Remove cleanup workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/single-branch-terminal-cleanup.yml
          git commit -m 'chore: remove single-branch cleanup workflow'
          git push origin HEAD:main
      - name: Close trigger PR and delete trigger branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr close "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
          git push origin --delete cleanup/safe-core-single-branch-trigger
