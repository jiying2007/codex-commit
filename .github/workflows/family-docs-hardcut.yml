name: Family docs hard cut
on:
  push:
    branches: [family/judgment-lifecycle-v1]
permissions:
  contents: write
jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: family/judgment-lifecycle-v1, fetch-depth: 0 }
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: { node-version: '22.22.2' }
      - name: Align Commit product docs with Review Receipt v5
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const oldSha='cd9788f1280a217fbe6d0beb59682a85a8b82c4d',newSha='8375907712db37492aff1ac0d0013e2753b1f6ab';
          function walk(dir,out=[]){for(const e of fs.readdirSync(dir,{withFileTypes:true})){if(['.git','node_modules','src'].includes(e.name))continue;const p=path.join(dir,e.name);if(e.isDirectory())walk(p,out);else if(e.name.endsWith('.md')&&e.name!=='CHANGELOG.md')out.push(p);}return out;}
          for(const file of walk('.')){let s=fs.readFileSync(file,'utf8');s=s.split(oldSha).join(newSha).replace(/Codex Safe Core 4\.10\.2/g,'Codex Safe Core 4.11.0').replace(/Safe Core 4\.10\.2/g,'Safe Core 4.11.0').replace(/Review Receipt v4/g,'Review Receipt v5');fs.writeFileSync(file,s);}
          if(fs.existsSync('.codex-safe.example.json')){const v=JSON.parse(fs.readFileSync('.codex-safe.example.json','utf8'));if(v.$schema)v.$schema='https://raw.githubusercontent.com/jiying2007/codex-safe-core/'+newSha+'/codex-safe.schema.json';fs.writeFileSync('.codex-safe.example.json',JSON.stringify(v,null,2)+'\n');}
          let verifier=fs.readFileSync('scripts/verify-product-docs.js','utf8');verifier=verifier.replace(/Review Receipt v4/g,'Review Receipt v5').replace(/Review Receipt v\[123\]/g,'Review Receipt v[1234]');fs.writeFileSync('scripts/verify-product-docs.js',verifier);
          NODE
          rm .github/workflows/family-docs-hardcut.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(commit): align Review Receipt v5 provenance'
          git push origin HEAD:family/judgment-lifecycle-v1
