name: Temporary Commit Runtime v3 docs
on:
  push:
    branches: [fix/docs-runtime-v3-4.5.2]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: true, fetch-depth: 0}
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: {node-version: '22.22.2'}
      - name: Align current Runtime v3 documentation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const version='4.5.2';
          const writeJson=(file,fn)=>{const x=JSON.parse(fs.readFileSync(file,'utf8'));fn(x);fs.writeFileSync(file,JSON.stringify(x,null,2)+'\n');};
          writeJson('package.json',x=>x.version=version);
          writeJson('package-lock.json',x=>{x.version=version;if(x.packages?.[''])x.packages[''].version=version;});
          writeJson('product-contract.json',x=>x.productVersion=version);
          const docs=['README.md','README.zh-CN.md','docs/GETTING_STARTED.md','docs/GETTING_STARTED.zh-CN.md','SUPPORT.md','SECURITY.md','PUBLISHING.md','VERIFY_RELEASE.md'].filter(fs.existsSync);
          for(const file of docs){let s=fs.readFileSync(file,'utf8');
            s=s.replace(/Codex Commit Safe intentionally ignores `~\/.codex\/config\.toml`\.[^\n]*/g,'Codex Commit Safe defaults to **Runtime Contract v3 Auto discovery**. It may reuse machine Family Runtime (`~/.codex-safe/runtime.json`) or machine Codex configuration (`${CODEX_HOME}/config.toml` / `~/.codex/config.toml`) in the Extension Host; VS Code provider settings remain machine-scoped advanced overrides. Environment Check performs a real structured round-trip.');
            s=s.replace(/Codex Commit Safe 会主动忽略 `~\/.codex\/config\.toml`。[^\n]*/g,'Codex Commit Safe 默认使用 **Runtime Contract v3 Auto discovery**。它可以在 Extension Host 中复用机器级 Family Runtime（`~/.codex-safe/runtime.json`）或机器级 Codex 配置（`${CODEX_HOME}/config.toml` / `~/.codex/config.toml`）；VS Code Provider 设置仅作为 machine-scope Advanced Override。环境检查会真实完成一次结构化 round-trip。');
            s=s.replace(/For `openai-compatible` providers, Codex Commit Safe 4\.4\.1 consumes Core Provider Contract v2\./g,'For `openai-compatible` providers, Codex Commit Safe 4.5.2 consumes Core Provider Contract v3.');
            s=s.replace(/`openai-compatible` Provider 从 Codex Commit Safe 4\.4\.1 起统一消费 Core Provider Contract v2。/g,'`openai-compatible` Provider 在 Codex Commit Safe 4.5.2 中消费 Core Provider Contract v3。');
            s=s.replace(/Codex Commit Safe 4\.5\.1/g,'Codex Commit Safe 4.5.2');
            fs.writeFileSync(file,s);
          }
          let c=fs.readFileSync('CHANGELOG.md','utf8');
          if(!c.startsWith('## 4.5.2'))c=`## 4.5.2 - 2026-09-03\n\n- Align current Runtime/Provider documentation with Runtime Contract v3 and Core Provider Contract v3: machine Family Runtime and machine Codex config are valid Auto-discovery sources and are not ignored.\n- Preserve Commit 4.5.1 runtime behavior and immutable Core 4.13.1 pin; this patch changes documentation/product identity only.\n\n${c}`;
          fs.writeFileSync('CHANGELOG.md',c);
          NODE
          printf '%s\n' 'Residual current-doc stale markers:'
          grep -nRE 'intentionally ignores `~/.codex/config.toml`|主动忽略 `~/.codex/config.toml`|Provider Contract v2|Codex Commit Safe 4\.4\.1' README.md README.zh-CN.md docs/GETTING_STARTED.md docs/GETTING_STARTED.zh-CN.md SUPPORT.md SECURITY.md PUBLISHING.md VERIFY_RELEASE.md 2>/dev/null && exit 2 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json product-contract.json CHANGELOG.md README.md README.zh-CN.md docs/GETTING_STARTED.md docs/GETTING_STARTED.zh-CN.md SUPPORT.md SECURITY.md PUBLISHING.md VERIFY_RELEASE.md
          git diff --cached --check
          git commit -m 'docs(runtime): align Commit 4.5.2 Runtime v3 guidance'
          git push origin HEAD:fix/docs-runtime-v3-4.5.2
