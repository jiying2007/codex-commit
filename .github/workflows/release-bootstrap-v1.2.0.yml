name: Bootstrap v1.2.0 release

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.head_ref == 'release-bootstrap-v1.2.0'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: 9fabeb31ab9f264f567b0ef3a6224832319a7b85
      RELEASE_TAG: v1.2.0
      RELEASE_VERSION: 1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify pinned release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          npm run verify:lock
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Build official VSIX
        shell: bash
        run: |
          set -euo pipefail
          npm run package
          test -f "codex-commit-safe-${RELEASE_VERSION}.vsix"
          sha256sum "codex-commit-safe-${RELEASE_VERSION}.vsix" > SHA256SUMS

      - name: Create tag and GitHub Release atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="$RELEASE_SHA" >/dev/null
          if ! gh release create "$RELEASE_TAG" \
            "codex-commit-safe-${RELEASE_VERSION}.vsix" \
            SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Codex Commit Safe ${RELEASE_VERSION}" \
            --generate-notes \
            --verify-tag; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" || true
            exit 1
          fi

      - name: Delete temporary branches
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            apply-windows-runtime-fix
            bootstrap-run
            ci-validation-1.2.0
            ci-validation-1.2.0b
            ci-validation-1.2.0c
            final-ci-validation-1.2.0
            release-1.2.0
            trigger-finalize-1.2.0
            trigger-test-rethrow
            trigger-test-rethrow-2
            trigger-windows-cmd-fix
            trigger-windows-verbatim-fix
            windows-diagnostic
            windows-verbatim-validation
            release-bootstrap-v1.2.0
          )
          for branch in "${branches[@]}"; do
            echo "Deleting temporary branch: $branch"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
          done
