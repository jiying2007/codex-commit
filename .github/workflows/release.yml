name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || { echo "tag v$tag does not match package.json version $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm run verify:lock
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check

  integration-linux:
    name: Extension Host / Linux
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Extension Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2
      - run: xvfb-run -a npm run test:integration

  integration-windows:
    name: Extension Host / Windows
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:integration

  release:
    name: Package and publish
    needs: [validate, integration-linux, integration-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package VSIX
        run: npm run package
      - name: Create checksum
        shell: bash
        run: sha256sum "codex-commit-safe-${{ needs.validate.outputs.version }}.vsix" > SHA256SUMS
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-commit-safe-${{ needs.validate.outputs.version }}
          path: |
            codex-commit-safe-${{ needs.validate.outputs.version }}.vsix
            SHA256SUMS
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            "codex-commit-safe-${version}.vsix" \
            SHA256SUMS \
            --title "Codex Commit Safe ${version}" \
            --generate-notes \
            --verify-tag
