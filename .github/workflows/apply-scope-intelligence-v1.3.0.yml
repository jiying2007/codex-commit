name: Apply Scope Intelligence v1.3.0

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  apply:
    if: github.head_ref == 'feat/scope-intelligence-v1.3.0' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/scope-intelligence-v1.3.0
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply Scope Intelligence hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-scope-intelligence-v1.3.0.py
          rm scripts/apply-scope-intelligence-v1.3.0.py
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm run verify:lock
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          git diff --check
      - name: Commit Scope Intelligence branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- extension.js package.json package-lock.json package.nls.json package.nls.zh-cn.json .codex-commit.example.json test.js test/scope-cases.json README.md README.zh-CN.md SECURITY.md CHANGELOG.md
          git add -u -- scripts/apply-scope-intelligence-v1.3.0.py
          git diff --cached --check
          git commit -m 'feat: add Scope Intelligence 1.3.0'
          git push origin HEAD:feat/scope-intelligence-v1.3.0
