name: Commit Safe v3 finalizer

on:
  push:
    branches: [feat/family-v3-commit]
    paths: [.github/workflows/v3-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - name: Finalize Family v3 metadata and docs
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive
          node <<'NODE'
          const fs=require('fs');
          const version='3.0.0', core='e6e25b502aa35a079f660346785cf283fe293b6d';
          for(const file of ['package.json','package-lock.json']){
            const o=JSON.parse(fs.readFileSync(file,'utf8'));o.version=version;if(o.packages?.[''])o.packages[''].version=version;fs.writeFileSync(file,JSON.stringify(o,null,2)+'\n');
          }
          if(fs.existsSync('.codex-safe.example.json')){
            const o=JSON.parse(fs.readFileSync('.codex-safe.example.json','utf8'));o.$schema=`https://raw.githubusercontent.com/jiying2007/codex-safe-core/${core}/codex-safe.schema.json`;o.schemaVersion=3;fs.writeFileSync('.codex-safe.example.json',JSON.stringify(o,null,2)+'\n');
          }
          let c=fs.readFileSync('CHANGELOG.md','utf8');if(!c.includes('\n## 3.0.0\n')){c=c.replace('## Unreleased\n','## Unreleased\n\n## 3.0.0\n\n### Changed\n\n- Hard-switched to Codex Safe Core 3.0.1 and Policy Schema v3.\n- Raised Commit and Review provenance consumption to Receipt v3 with no v2 storage/parser fallback.\n- Preserved Commit Safe domain behavior and existing Safe Contract v2 execution boundary.\n');fs.writeFileSync('CHANGELOG.md',c);}
          const docs=['README.md','README.zh-CN.md','SECURITY.md','PUBLISHING.md','CONTRIBUTING.md'];
          for(const file of docs){if(!fs.existsSync(file))continue;let s=fs.readFileSync(file,'utf8');s=s.replace(/Review Receipt v2/g,'Review Receipt v3').replace(/Commit Receipt v2/g,'Commit Receipt v3').replace(/Policy Schema v2/g,'Policy Schema v3').replace(/Safe Core v2/g,'Safe Core v3').replace(/Core v2/g,'Core v3').replace(/"schemaVersion"\s*:\s*2/g,'"schemaVersion": 3').replace(/schemaVersion:\s*2/g,'schemaVersion: 3').replace(/codex-safe-core\/[0-9a-f]{40,64}\/codex-safe\.schema\.json/g,`codex-safe-core/${core}/codex-safe.schema.json`);if(file==='README.md'&&!s.includes('Safe Contract remains v2'))s=s.replace('\n## ',`\n\nFamily v3 pins Codex Safe Core 3.0.1 at \`${core}\`; the execution-level Safe Contract remains v2 while Policy and Receipt protocols are v3.\n\n## `);if(file==='README.zh-CN.md'&&!s.includes('Safe Contract 仍保持 v2'))s=s.replace('\n## ',`\n\nFamily v3 固定使用 Codex Safe Core 3.0.1（\`${core}\`）；执行层 Safe Contract 仍保持 v2，Policy 与 Receipt 协议升级为 v3。\n\n## `);fs.writeFileSync(file,s);}
          NODE
          npm run verify:lock
          git rm .github/workflows/v3-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json CHANGELOG.md .codex-safe.example.json README* SECURITY.md PUBLISHING.md CONTRIBUTING.md
          git diff --cached --check
          git commit -m 'chore(release): finalize Commit Safe v3.0.0 metadata'
          git push origin HEAD:feat/family-v3-commit
