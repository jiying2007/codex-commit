name: Terminal Branch Cleanup

on:
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: terminal-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.head_ref == 'cleanup-terminal-branches-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Verify inventory and delete terminal branches
        shell: bash
        run: |
          set -euo pipefail

          stale=(
            'build/typecheck-pure-modules'
            'cleanup/final-transition-removal'
            'cleanup/terminal-hygiene'
            'codex/adopt-safe-core-v1'
            'codex/remove-transition-residue'
            'feat/style-intelligence-bundle'
            'feat/vscode-best-practices'
            'refactor/git-codex-runtime'
            'refactor/git-safe-core-adapter'
            'refactor/policy-validation'
            'refactor/process-runner'
            'refactor/scope-module'
          )
          expected=(main safe-core-v1 cleanup-terminal-branches-trigger "${stale[@]}")

          actual_text=$(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort)
          expected_text=$(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$actual_text" != "$expected_text" ]]; then
            echo 'Remote branch inventory changed; refusing to delete unknown or unreviewed branches.' >&2
            echo 'Expected:' >&2
            printf '%s\n' "$expected_text" >&2
            echo 'Actual:' >&2
            printf '%s\n' "$actual_text" >&2
            exit 2
          fi

          for branch in "${stale[@]}"; do
            git push origin --delete "$branch"
          done

          remaining=$(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort)
          expected_remaining=$(printf '%s\n' main safe-core-v1 cleanup-terminal-branches-trigger | sort)
          if [[ "$remaining" != "$expected_remaining" ]]; then
            echo 'Branch cleanup did not reach the expected terminal set.' >&2
            printf '%s\n' "$remaining" >&2
            exit 3
          fi

      - name: Remove cleanup workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git switch -C main origin/main
          git rm .github/workflows/terminal-branch-cleanup.yml
          git commit -m 'chore: remove terminal branch cleanup workflow'
          git push origin HEAD:main

      - name: Close trigger PR and delete trigger branch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}" \
            -d '{"state":"closed"}' >/dev/null
          git push origin --delete cleanup-terminal-branches-trigger
