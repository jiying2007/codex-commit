name: Safe Core Main Source Finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: safe-core-main-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'chore/safe-core-main-source'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/safe-core-main-source
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply fail-closed canonical-source migration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/safe-core-main-source-codemod.js
      - name: Verify terminal source semantics
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number --fixed-strings 'safe-core-v1' safe-core.lock.json src/codex-safe-core scripts docs .github/workflows package.json
          ! grep -R --line-number --fixed-strings 'safe-core.js upstream' docs .github/workflows package.json
          ! grep -R --line-number --fixed-strings 'safe-core.js sync' docs .github/workflows package.json
      - run: npm run check
      - run: npm run package
      - name: Remove one-time branch machinery
        run: rm scripts/safe-core-main-source-codemod.js
      - name: Commit finalized source migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- safe-core.lock.json src/codex-safe-core/manifest.json scripts/safe-core.js docs/SAFE_CORE.md .github/workflows/safe-core.yml scripts/safe-core-main-source-codemod.js
          git diff --cached --check
          git commit -m 'refactor(core): make main the canonical Safe Core source'
          git push origin HEAD:chore/safe-core-main-source
      - name: Remove trusted one-time base workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C main origin/main
          git rm .github/workflows/safe-core-main-source-finalizer.yml
          git commit -m 'chore: remove Safe Core source finalizer'
          git push origin HEAD:main
